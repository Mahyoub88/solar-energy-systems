<text x="60" y="75" font-size="38" font-weight="700">SOLAR SYSTEM ARCHITECTURE</text><text x="60" y="120" font-size="22" fill="#53677c">Generation, energy storage and AC / DC supply</text>
<g fill="white" stroke="#c9d8e5" stroke-width="2"><rect x="60" y="245" width="205" height="130" rx="14"/><rect x="315" y="245" width="205" height="130" rx="14"/><rect x="570" y="245" width="240" height="130" rx="14"/><rect x="910" y="445" width="230" height="130" rx="14"/><rect x="1060" y="180" width="200" height="115" rx="14"/><rect x="1310" y="180" width="230" height="115" rx="14"/><rect x="1060" y="325" width="200" height="115" rx="14"/><rect x="1310" y="325" width="230" height="115" rx="14"/></g>
