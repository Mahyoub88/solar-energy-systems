<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img">
<title>Solar generation, storage and load supply</title><desc>PV array feeds a DC combiner and charge controller. A DC bus connects battery storage, an inverter for AC loads and a regulated path for DC loads. Battery connection is bidirectional. Protection and monitoring cover all stages.</desc>
