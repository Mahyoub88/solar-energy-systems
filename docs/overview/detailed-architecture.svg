<g text-anchor="middle" font-size="18" fill="#53677c"><text x="162" y="338">Generate electricity</text><text x="417" y="338">Combine PV strings</text><text x="690" y="338">Manage charging</text><text x="1025" y="540">Charge / discharge</text><text x="1160" y="267">DC to AC</text><text x="1425" y="267">AC equipment</text><text x="1160" y="412">Match load supply</text><text x="1425" y="412">Telecom equipment</text></g>
